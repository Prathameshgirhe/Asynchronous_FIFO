<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#141b2d"/></linearGradient>
<linearGradient id="gcm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff3df5"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/></marker></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
@keyframes rowhl{0%,100%{opacity:0}10%,20%{opacity:.35}30%{opacity:0}}
@keyframes fill{from{width:0}to{width:620px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}
.flow2{stroke-dasharray:7 6;animation:dash 0.9s linear infinite reverse}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.float{animation:floaty 3s ease-in-out infinite}
text{font-family:'Segoe UI',Consolas,Menlo,monospace}
</style><rect width="900" height="440" rx="14" fill="url(#bg)"/>
<text x="450.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="url(#gcm)">Self-Checking Verification</text><rect x="40" y="70" width="140" height="80" rx="10" fill="#0f1626" stroke="#00e5ff" stroke-width="2" class="glow" style="color:#00e5ff"/><text x="110" y="105" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Stimulus</text><text x="110" y="125" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Generator</text><path d="M180,110 L210,110" fill="none" stroke="#00e5ff" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><rect x="210" y="70" width="140" height="80" rx="10" fill="#0f1626" stroke="#00e5ff" stroke-width="2" class="glow" style="color:#00e5ff"/><text x="280" y="105" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Write</text><text x="280" y="125" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Driver</text><path d="M350,110 L380,110" fill="none" stroke="#00e5ff" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><rect x="380" y="70" width="140" height="80" rx="10" fill="#0f1626" stroke="#39ff88" stroke-width="2" class="glow" style="color:#39ff88"/><text x="450" y="105" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >DUT</text><text x="450" y="125" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >async_fifo</text><path d="M520,110 L550,110" fill="none" stroke="#39ff88" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><rect x="550" y="70" width="140" height="80" rx="10" fill="#0f1626" stroke="#ff3df5" stroke-width="2" class="glow" style="color:#ff3df5"/><text x="620" y="105" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Read</text><text x="620" y="125" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Monitor</text><path d="M690,110 L720,110" fill="none" stroke="#ff3df5" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><rect x="720" y="70" width="140" height="80" rx="10" fill="#0f1626" stroke="#ffb020" stroke-width="2" class="glow" style="color:#ffb020"/><text x="790" y="105" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >Scoreboard</text><text x="790" y="125" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700" >(self-check)</text><text x="450" y="205" fill="#8b98b0" font-size="13" text-anchor="middle" font-weight="400" >Random + directed traffic across multiple wclk / rclk ratios</text><text x="40" y="250" fill="#e6edf3" font-size="15" text-anchor="start" font-weight="700" >Transactions verified</text><text x="860" y="250" fill="#39ff88" font-size="15" text-anchor="end" font-weight="800" >10,000+</text><rect x="40" y="262" width="820" height="22" rx="11" fill="#0f1626" stroke="#8b98b0"/><rect x="40" y="262" height="22" rx="11" fill="url(#gcm)" style="animation:fill 3s ease-out infinite alternate"/><rect x="40" y="320" width="185" height="56" rx="12" fill="#39ff88" fill-opacity=".12" stroke="#39ff88" class="pulse" style="animation-delay:0.0s"/><text x="132" y="354" fill="#39ff88" font-size="14" text-anchor="middle" font-weight="700" >✔ 0 data mismatches</text><rect x="245" y="320" width="185" height="56" rx="12" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" class="pulse" style="animation-delay:0.3s"/><text x="337" y="354" fill="#00e5ff" font-size="14" text-anchor="middle" font-weight="700" >✔ Full / Empty</text><rect x="450" y="320" width="185" height="56" rx="12" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" class="pulse" style="animation-delay:0.6s"/><text x="542" y="354" fill="#ffb020" font-size="14" text-anchor="middle" font-weight="700" >✔ Overflow</text><rect x="655" y="320" width="185" height="56" rx="12" fill="#ff3df5" fill-opacity=".12" stroke="#ff3df5" class="pulse" style="animation-delay:0.8999999999999999s"/><text x="747" y="354" fill="#ff3df5" font-size="14" text-anchor="middle" font-weight="700" >✔ Underflow</text><text x="450" y="415" fill="#8b98b0" font-size="12" text-anchor="middle" font-weight="400" >Self-checking: every read is compared against a reference model automatically</text></svg>