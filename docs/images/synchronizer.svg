<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#141b2d"/></linearGradient>
<linearGradient id="gcm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff3df5"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/></marker></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
@keyframes rowhl{0%,100%{opacity:0}10%,20%{opacity:.35}30%{opacity:0}}
@keyframes fill{from{width:0}to{width:620px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}
.flow2{stroke-dasharray:7 6;animation:dash 0.9s linear infinite reverse}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.float{animation:floaty 3s ease-in-out infinite}
text{font-family:'Segoe UI',Consolas,Menlo,monospace}
</style><rect width="900" height="430" rx="14" fill="url(#bg)"/>
<text x="450.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="url(#gcm)">2-FF Synchronizer</text><rect x="40" y="150" width="150" height="90" rx="10" fill="#0f1626" stroke="#00e5ff" stroke-width="2" class="glow" style="color:#00e5ff"/><text x="115.0" y="193.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="700" >Source reg</text><text x="115.0" y="212.0" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >wclk domain</text><rect x="300" y="150" width="110" height="90" rx="10" fill="#0f1626" stroke="#ff3df5" stroke-width="2" class="glow" style="color:#ff3df5"/><text x="355.0" y="193.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="700" >FF1</text><text x="355.0" y="212.0" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >rclk</text><rect x="500" y="150" width="110" height="90" rx="10" fill="#0f1626" stroke="#ff3df5" stroke-width="2" class="glow" style="color:#ff3df5"/><text x="555.0" y="193.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="700" >FF2</text><text x="555.0" y="212.0" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >rclk</text><rect x="700" y="150" width="150" height="90" rx="10" fill="#0f1626" stroke="#ff3df5" stroke-width="2" class="glow" style="color:#ff3df5"/><text x="775.0" y="193.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="700" >Dest logic</text><text x="775.0" y="212.0" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >rclk domain</text><path d="M190,195 L300,195" fill="none" stroke="#00e5ff" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><path d="M410,195 L500,195" fill="none" stroke="#ff3df5" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><path d="M610,195 L700,195" fill="none" stroke="#ff3df5" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><circle r="7" fill="#39ff88"><animateMotion dur="4s" repeatCount="indefinite" path="M190,195 L300,195 L410,195 L500,195 L610,195 L700,195"/></circle><text x="355" y="275" fill="#ffb020" font-size="12" text-anchor="middle" font-weight="400" >may go metastable</text><text x="555" y="275" fill="#39ff88" font-size="12" text-anchor="middle" font-weight="400" >resolved &amp; stable</text><path d="M355,95 L355,150" stroke="#ff3df5" stroke-width="2"/><path d="M555,95 L555,150" stroke="#ff3df5" stroke-width="2"/><path d="M320,95 h70" stroke="#ff3df5" stroke-width="2"/><path d="M520,95 h70" stroke="#ff3df5" stroke-width="2"/><text x="455" y="80" fill="#ff3df5" font-size="12" text-anchor="middle" font-weight="400" >rclk ──────────────────────</text><text x="450" y="330" fill="#8b98b0" font-size="13" text-anchor="middle" font-weight="400" >The first flop may sample mid-transition. The second flop gives it a full clock cycle</text><text x="450" y="352" fill="#8b98b0" font-size="13" text-anchor="middle" font-weight="400" >to settle — reducing the MTBF risk to an acceptably tiny value.</text><text x="450" y="395" fill="#00e5ff" font-size="14" text-anchor="middle" font-weight="700" >2-FF synchronizer  =  industry-standard CDC for single-bit / Gray-coded signals</text></svg>