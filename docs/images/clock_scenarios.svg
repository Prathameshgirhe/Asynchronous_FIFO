00" >wclk ≫ rclk</text><text x="617" y="165" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >stress: overflow path</text><text x="617" y="215" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="700" >✔ tested</text></g><g class="float" style="animation-delay:1.6s"><rect x="710" y="95" width="155" height="150" rx="12" fill="#0f1626" stroke="#00e5ff" stroke-width="2"/><text x="787" y="135" fill="#00e5ff" font-size="16" text-anchor="middle" font-weight="800" >wclk ≪ rclk</text><text x="787" y="165" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >stress: underflow path</text><text x="787" y="215" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="700" >✔ tested</text></g><text x="450" y="285" fill="#8b98b0" font-size="11" text-anchor="middle" font-weight="400" >Edit the labels to your exact frequency pairs</text></svg>