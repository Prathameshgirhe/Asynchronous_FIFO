<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#141b2d"/></linearGradient>
<linearGradient id="gcm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff3df5"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/></marker></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
@keyframes rowhl{0%,100%{opacity:0}10%,20%{opacity:.35}30%{opacity:0}}
@keyframes fill{from{width:0}to{width:620px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}
.flow2{stroke-dasharray:7 6;animation:dash 0.9s linear infinite reverse}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.float{animation:floaty 3s ease-in-out infinite}
text{font-family:'Segoe UI',Consolas,Menlo,monospace}
</style><rect width="900" height="500" rx="14" fill="url(#bg)"/>
<text x="450.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="url(#gcm)">Full & Empty Detection</text><circle cx="300" cy="130" r="30" fill="#0f1626" fill-opacity="1" stroke="#8b98b0" stroke-width="2" class=""/><text x="300.0" y="135.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >0</text><circle cx="392" cy="168" r="30" fill="#0f1626" fill-opacity="1" stroke="#8b98b0" stroke-width="2" class=""/><text x="391.9238815542512" y="173.07611844574882" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >1</text><circle cx="430" cy="260" r="30" fill="#39ff88" fill-opacity="0.25" stroke="#39ff88" stroke-width="2" class="pulse"/><text x="430.0" y="265.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >2</text><circle cx="392" cy="352" r="30" fill="#39ff88" fill-opacity="0.25" stroke="#39ff88" stroke-width="2" class="pulse"/><text x="391.9238815542512" y="356.9238815542512" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >3</text><circle cx="300" cy="390" r="30" fill="#39ff88" fill-opacity="0.25" stroke="#39ff88" stroke-width="2" class="pulse"/><text x="300.0" y="395.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >4</text><circle cx="208" cy="352" r="30" fill="#39ff88" fill-opacity="0.25" stroke="#39ff88" stroke-width="2" class="pulse"/><text x="208.07611844574882" y="356.9238815542512" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >5</text><circle cx="170" cy="260" r="30" fill="#0f1626" fill-opacity="1" stroke="#8b98b0" stroke-width="2" class=""/><text x="170.0" y="265.0" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >6</text><circle cx="208" cy="168" r="30" fill="#0f1626" fill-opacity="1" stroke="#8b98b0" stroke-width="2" class=""/><text x="208.07611844574882" y="173.07611844574882" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600" >7</text><text x="502.0" y="265.0" fill="#ff3df5" font-size="15" text-anchor="middle" font-weight="800" >▲ rptr</text><text x="98.0" y="265.0" fill="#00e5ff" font-size="15" text-anchor="middle" font-weight="800" >wptr ▲</text><text x="300" y="256" fill="#8b98b0" font-size="13" text-anchor="middle" font-weight="400" >circular</text><text x="300" y="276" fill="#8b98b0" font-size="13" text-anchor="middle" font-weight="400" >buffer</text><rect x="520" y="90" width="360" height="340" rx="12" fill="#0f1626" stroke="url(#gcm)" stroke-width="2"/><text x="540" y="130" fill="#ff3df5" font-size="16" text-anchor="start" font-weight="800" >EMPTY</text><text x="540" y="154" fill="#e6edf3" font-size="12" text-anchor="start" font-weight="400" font-family="Consolas,monospace">rgray_next == wptr_sync</text><text x="540" y="174" fill="#8b98b0" font-size="12" text-anchor="start" font-weight="400" >pointers fully equal</text><text x="540" y="230" fill="#00e5ff" font-size="16" text-anchor="start" font-weight="800" >FULL</text><text x="540" y="254" fill="#e6edf3" font-size="12" text-anchor="start" font-weight="400" font-family="Consolas,monospace">wgray_next == {~rq2[N:N-1], rq2[N-2:0]}</text><text x="540" y="274" fill="#8b98b0" font-size="12" text-anchor="start" font-weight="400" >MSBs differ, rest equal</text><text x="540" y="330" fill="#ffb020" font-size="16" text-anchor="start" font-weight="800" >N+1 bit pointers</text><text x="540" y="354" fill="#e6edf3" font-size="12" text-anchor="start" font-weight="400" font-family="Consolas,monospace">extra MSB tracks wrap-around</text><text x="540" y="374" fill="#8b98b0" font-size="12" text-anchor="start" font-weight="400" >separates full from empty</text><text x="300" y="470" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >Empty is decided in the read domain, Full in the write domain</text></svg>