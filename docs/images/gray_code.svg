<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#141b2d"/></linearGradient>
<linearGradient id="gcm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff3df5"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/></marker></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
@keyframes rowhl{0%,100%{opacity:0}10%,20%{opacity:.35}30%{opacity:0}}
@keyframes fill{from{width:0}to{width:620px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}
.flow2{stroke-dasharray:7 6;animation:dash 0.9s linear infinite reverse}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.float{animation:floaty 3s ease-in-out infinite}
text{font-family:'Segoe UI',Consolas,Menlo,monospace}
</style><rect width="900" height="470" rx="14" fill="url(#bg)"/>
<text x="450.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="url(#gcm)">Gray-Code Pointers</text><text x="180" y="80" fill="#8b98b0" font-size="12" text-anchor="middle" font-weight="400" >DEC</text><text x="280" y="80" fill="#00e5ff" font-size="12" text-anchor="middle" font-weight="400" >BINARY</text><text x="400" y="80" fill="#ff3df5" font-size="12" text-anchor="middle" font-weight="400" >GRAY</text><text x="510" y="80" fill="#8b98b0" font-size="12" text-anchor="middle" font-weight="400" >BITS FLIPPED →</text><rect x="130" y="88" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:0s"/><text x="180" y="110" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >0</text><text x="280" y="110" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">000</text><text x="400" y="110" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">000</text><text x="470" y="110" fill="#ffb020" font-size="13" text-anchor="middle" font-weight="400" >bin: 3</text><text x="545" y="110" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="128" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:1s"/><text x="180" y="150" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >1</text><text x="280" y="150" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">001</text><text x="400" y="150" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">001</text><text x="470" y="150" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >bin: 1</text><text x="545" y="150" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="168" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:2s"/><text x="180" y="190" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >2</text><text x="280" y="190" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">010</text><text x="400" y="190" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">011</text><text x="470" y="190" fill="#ffb020" font-size="13" text-anchor="middle" font-weight="400" >bin: 2</text><text x="545" y="190" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="208" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:3s"/><text x="180" y="230" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >3</text><text x="280" y="230" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">011</text><text x="400" y="230" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">010</text><text x="470" y="230" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >bin: 1</text><text x="545" y="230" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="248" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:4s"/><text x="180" y="270" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >4</text><text x="280" y="270" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">100</text><text x="400" y="270" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">110</text><text x="470" y="270" fill="#ffb020" font-size="13" text-anchor="middle" font-weight="400" >bin: 3</text><text x="545" y="270" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="288" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:5s"/><text x="180" y="310" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >5</text><text x="280" y="310" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">101</text><text x="400" y="310" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">111</text><text x="470" y="310" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >bin: 1</text><text x="545" y="310" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="328" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:6s"/><text x="180" y="350" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >6</text><text x="280" y="350" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">110</text><text x="400" y="350" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">101</text><text x="470" y="350" fill="#ffb020" font-size="13" text-anchor="middle" font-weight="400" >bin: 2</text><text x="545" y="350" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="130" y="368" width="440" height="32" rx="6" fill="#39ff88" opacity="0" style="animation:rowhl 8s infinite;animation-delay:7s"/><text x="180" y="390" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" >7</text><text x="280" y="390" fill="#00e5ff" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">111</text><text x="400" y="390" fill="#ff3df5" font-size="18" text-anchor="middle" font-weight="700" letter-spacing="3">100</text><text x="470" y="390" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >bin: 1</text><text x="545" y="390" fill="#39ff88" font-size="13" text-anchor="middle" font-weight="400" >gray: 1</text><rect x="610" y="95" width="270" height="300" rx="12" fill="#0f1626" stroke="#ffb020" stroke-width="2" class="glow" style="color:#ffb020"/><text x="745" y="125" fill="#ffb020" font-size="15" text-anchor="middle" font-weight="700" >WHY GRAY CODE?</text><text x="630" y="155" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="400" >A pointer crosses clock domains.</text><text x="630" y="178" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="400" >Binary 011 → 100 flips 3 bits;</text><text x="630" y="201" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="400" >a sampler may catch a mixed value</text><text x="630" y="224" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="400" >(e.g. 111) — a false address!</text><text x="630" y="247" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="400" ></text><text x="630" y="270" fill="#39ff88" font-size="12.5" text-anchor="start" font-weight="400" >Gray changes exactly ONE bit,</text><text x="630" y="293" fill="#39ff88" font-size="12.5" text-anchor="start" font-weight="400" >so the sampled value is either</text><text x="630" y="316" fill="#39ff88" font-size="12.5" text-anchor="start" font-weight="400" >the old pointer or the new one —</text><text x="630" y="339" fill="#39ff88" font-size="12.5" text-anchor="start" font-weight="400" >never garbage.</text><text x="450" y="440" fill="#39ff88" font-size="14" text-anchor="middle" font-weight="700" >Only 1 bit differs between consecutive values  →  safe to synchronize</text></svg>